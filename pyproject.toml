[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heavy-machinery-predictive-maintenance"
version = "0.1.0"
description = "Hybrid S.O.S fluid, telematics and work-order predictive maintenance POC"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
